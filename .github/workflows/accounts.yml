name: Account regression
on:
  workflow_call:
  pull_request:
    paths:
      - 'worker/**'
      - 'migrations/**'
      - 'catalog/**'
      - 'scripts/*catalog*'
      - 'src/**'
      - 'package*.json'
      - 'scripts/*account*'
      - 'wrangler.jsonc'
      - '.github/workflows/accounts.yml'
permissions:
  contents: read
jobs:
  accounts:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci && npm run typecheck && npm run build
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - name: Verify Clerk session validation and private scores using a browser and local Worker
        run: bash scripts/ci-accounts.sh
      - uses: actions/upload-artifact@v4
        with:
          name: account-regression
          path: |
            artifacts/accounts.json
            artifacts/catalog.json
