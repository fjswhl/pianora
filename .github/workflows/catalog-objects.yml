name: Verify and upload catalog objects
on:
  workflow_dispatch:
    inputs:
      collection:
        description: Score collection
        type: choice
        options: [seed, mutopia-piano, keyboard-editions, mutopia-keyboard, classical-mxl, classical-mxl-2, well-tempered, concert-repertoire]
        default: seed
permissions:
  contents: read
jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Restore and verify the publisher's editions
        if: inputs.collection != 'seed'
        env:
          COLLECTION: ${{ inputs.collection }}
        run: python3 scripts/restore-collection.py "catalog/collections/$COLLECTION.json" "$RUNNER_TEMP/scores"
      - name: Upload missing files and verify stored checksums
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          COLLECTION: ${{ inputs.collection }}
        run: |
          args=()
          if [[ "$COLLECTION" != seed ]]; then
            args=(--manifest "catalog/collections/$COLLECTION.json" --files "$RUNNER_TEMP/scores")
          fi
          node scripts/import-catalog.mjs --remote "${args[@]}" --sql-out catalog.sql
      - uses: actions/upload-artifact@v4
        with:
          name: verified-catalog-metadata
          path: catalog.sql
