name: Verify and upload catalog objects
on:
  workflow_dispatch:
    inputs:
      collection:
        description: Score collection
        type: choice
        options: [seed, mutopia-piano]
        default: seed
permissions:
  contents: read
jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Restore pinned Mutopia sources
        if: inputs.collection == 'mutopia-piano'
        run: python3 scripts/fetch-mutopia.py "$RUNNER_TEMP/mutopia"
      - name: Upload missing files and verify stored checksums
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          COLLECTION: ${{ inputs.collection }}
        run: |
          args=()
          if [[ "$COLLECTION" == mutopia-piano ]]; then
            args=(--manifest catalog/collections/mutopia-piano.json --files "$RUNNER_TEMP/mutopia")
          fi
          node scripts/import-catalog.mjs --remote "${args[@]}" --sql-out catalog.sql
      - uses: actions/upload-artifact@v4
        with:
          name: verified-catalog-metadata
          path: catalog.sql
