name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two productions deploys at once; a new push cancels the older run.
concurrency:
  group: deploy-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  accounts:
    uses: ./.github/workflows/accounts.yml
  deploy:
    needs: accounts
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # public/ort and public/spessa are gitignored; restore them from node_modules
      - name: Restore browser runtime assets
        run: npm run setup:runtime

      - name: Typecheck
        run: npm run typecheck

      - name: Restore compressed binary assets
        id: packs
        uses: actions/cache@v4
        with:
          path: public/packs
          key: asset-packs-v1-${{ hashFiles('src/engine/assetSources.json', 'scripts/prepare-asset-packs.mjs', 'package-lock.json') }}

      - name: Compress released binaries
        if: steps.packs.outputs.cache-hit != 'true'
        env:
          PIANORA_PACK_ORIGIN: ${{ vars.VITE_R2_PUBLIC_ORIGIN || 'https://opuslin.uk' }}
        run: npm run setup:packs

      - name: Build
        env:
          VITE_R2_PUBLIC_ORIGIN: ${{ vars.VITE_R2_PUBLIC_ORIGIN }}
        run: npm run build

      # Needs repo secrets: CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID
      - name: Deploy Worker + static assets
        run: node scripts/deploy-accounts.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PIANORA_D1_ID: ${{ vars.PIANORA_D1_ID }}
          PIANORA_APPLIED_SCHEMA: ${{ vars.PIANORA_APPLIED_SCHEMA }}
          CLERK_PUBLISHABLE_KEY: ${{ vars.CLERK_PUBLISHABLE_KEY }}
