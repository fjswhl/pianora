name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two productions deploys at once; a new push cancels the older run.
concurrency:
  group: deploy-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # public/ort and public/spessa are gitignored; restore them from node_modules
      - name: Restore browser runtime assets
        run: npm run setup:runtime

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # Needs repo secrets: CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID
      - name: Deploy Worker + static assets
        uses: cloudflare/wrangler-action@v3
        with:
          # v4 understands wrangler.jsonc (v3 does not)
          wranglerVersion: '4'
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
