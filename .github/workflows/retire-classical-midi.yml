name: Retire superseded classical MIDI files
on: workflow_dispatch
permissions:
  contents: read
jobs:
  remove-verified-objects:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: git fetch --depth=1 origin f323baf8a1af48f64e690afdd214624d79537c64
      - name: Verify live catalog, remove retired files and check for absence
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/retire-classical-midi.mjs --remove-r2
